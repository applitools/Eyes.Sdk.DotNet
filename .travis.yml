language: csharp
solution: Eyes.Sdk.DotNet_Travis.sln

node_js:
  - "18"

os: linux
dist: focal

services:
  - docker
  - xvfb

branches:
  except:
  - /^[a-zA-Z]+_\d+(\.\d+)+$/

#addons:
#  chrome: stable
#  firefox: latest

git:
  depth: 3
  submodules: false

before_install:
  - echo -e "\n\nmachine github.com\n  login $GITHUB_TOKEN\n" >~/.netrc
  - git submodule update --init --recursive
  - nvm install 18
  - nvm use 18

before_script:
  - export DRIVER_PATH=/home/travis/build/
  - export APPLITOOLS_REPORT_ID=${TRAVIS_COMMIT:0:7}-$TRAVIS_BUILD_NUMBER
  - sudo apt-get -f install
  - sudo apt-get install -y libgdiplus
  #- export APPLITOOLS_PROXY=http://127.0.0.1:8080
  #- sudo chmod +x ./setup_proxy.sh && ./setup_proxy.sh
  - echo "Travis event type is $TRAVIS_EVENT_TYPE"
  - if [[ $TRAVIS_EVENT_TYPE = cron ]]; then
      export APPLITOOLS_FULL_COVERAGE=true;
    fi
  - export TEST_REPORT_SANDBOX=true;
  - if [[ $TRAVIS_TAG =~ ^RELEASE_CANDIDATE ]]; then
      python updateChangelogAndProjectFiles.py;
      export TEST_REPORT_SANDBOX=false;
    fi
  - echo "TEST_REPORT_SANDBOX = $TEST_REPORT_SANDBOX"

jobs:
  include:
    - stage: Test
      name: Generic Tests Selenium 3
      mono: none
      dotnet: 6.0.408
      addons:
        chrome: stable
        firefox: latest
      script:
        - chmod +x ./initChromeDriver.sh && ./initChromeDriver.sh
        - chmod +x ./initGeckoDriver.sh && ./initGeckoDriver.sh
        - chmod +x ./genericTests.sh && ./genericTests.sh

    - name: Generic Tests Selenium 4
      mono: none
      dotnet: 6.0.408
      addons:
        chrome: stable
        firefox: latest
      script:
        - chmod +x ./initChromeDriver.sh && ./initChromeDriver.sh
        - chmod +x ./initGeckoDriver.sh && ./initGeckoDriver.sh
        - chmod +x ./genericSelenium4.sh && ./genericSelenium4.sh

    - name: Generic Tests Playwright
      mono: none
      dotnet: 6.0.408
      addons:
        chrome: stable
        firefox: latest
      script:
        - chmod +x ./initChromeDriver.sh && ./initChromeDriver.sh
        - chmod +x ./initGeckoDriver.sh && ./initGeckoDriver.sh
        - chmod +x ./install_pwsh.sh && ./install_pwsh.sh
        - pwsh ./genericTests_playwright.ps1
    
    - name: E2E Tests Selenium
      mono: none
      dotnet: 6.0.408
      addons:
        chrome: stable
        firefox: latest
      script:
        - chmod +x ./initChromeDriver.sh && ./initChromeDriver.sh
        - chmod +x ./initGeckoDriver.sh && ./initGeckoDriver.sh
        - dotnet test ./Tests/Eyes.Selenium.E2ETests/Eyes.Selenium.E2ETests.csproj -- NUnit.NumberOfTestWorkers=15

    - name: Unit Tests Selenium
      mono: none
      dotnet: 6.0.408
      addons:
        chrome: stable
        firefox: latest
      script:
        - chmod +x ./initChromeDriver.sh && ./initChromeDriver.sh
        - chmod +x ./initGeckoDriver.sh && ./initGeckoDriver.sh
        - dotnet test ./Tests/Eyes.Selenium.UnitTests/Eyes.Selenium.UnitTests.csproj -- NUnit.NumberOfTestWorkers=15

    - name: xUnit Tests Selenium
      mono: none
      dotnet: 3.1.407
      addons:
        chrome: stable
        firefox: latest
      script:
        - chmod +x ./initChromeDriver.sh && ./initChromeDriver.sh
        - chmod +x ./initGeckoDriver.sh && ./initGeckoDriver.sh
        - dotnet test ./Tests/Eyes.Selenium.xUnitTests/Eyes.Selenium.xUnitTests.csproj -- NUnit.NumberOfTestWorkers=15

    - name: Unit Tests Appium
      mono: none
      dotnet: 6.0.408
      addons:
        chrome: stable
        firefox: latest
      script:
        - chmod +x ./initChromeDriver.sh && ./initChromeDriver.sh
        - chmod +x ./initGeckoDriver.sh && ./initGeckoDriver.sh
        - dotnet test ./Tests/Eyes.Appium.UnitTests/Eyes.Appium.UnitTests.csproj -- NUnit.NumberOfTestWorkers=15

    - name: E2E Tests Appium
      mono: none
      dotnet: 6.0.408
      addons:
        chrome: stable
        firefox: latest
      script:
        - chmod +x ./initChromeDriver.sh && ./initChromeDriver.sh
        - chmod +x ./initGeckoDriver.sh && ./initGeckoDriver.sh
        - dotnet test ./Tests/Eyes.Appium.E2ETests/Eyes.Appium.E2ETests.csproj -- NUnit.NumberOfTestWorkers=15

    - name: E2E Tests Images
      mono: none
      dotnet: 3.1.407
      addons:
        chrome: stable
        firefox: latest
      script:
        - chmod +x ./initChromeDriver.sh && ./initChromeDriver.sh
        - chmod +x ./initGeckoDriver.sh && ./initGeckoDriver.sh
        - dotnet test ./Tests/Eyes.Images.E2ETests/Eyes.Images.E2ETests.csproj -- NUnit.NumberOfTestWorkers=15

    - name: E2E Tests Images Core
      mono: none
      dotnet: 7.0.102
      addons:
        chrome: stable
        firefox: latest
      script:
        - chmod +x ./initChromeDriver.sh && ./initChromeDriver.sh
        - chmod +x ./initGeckoDriver.sh && ./initGeckoDriver.sh
        - dotnet test ./Tests/Eyes.Images.Core.E2ETests/Eyes.Images.Core.E2ETests.csproj -- NUnit.NumberOfTestWorkers=15

    - stage: Full Regression Mail
      if: type = cron AND branch = master
      mono: none
      script:
        - chmod +x ./sendFullCoverageReport.sh && ./sendFullCoverageReport.sh

    - stage: Deploy
      if: tag =~ ^RELEASE_CANDIDATE AND fork == false
      mono: none
      dotnet: 6.0.408
      script:
        - chmod +x ./deploy.sh && ./deploy.sh
        - chmod +x ./sendMail.sh && ./sendMail.sh