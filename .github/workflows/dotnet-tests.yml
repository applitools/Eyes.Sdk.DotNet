name: Test on all platforms
on:
  push:
  pull_request:

jobs:

  dotnet-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ] #, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 16
      - uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - uses: actions/setup-dotnet@v2
        with:
          dotnet-version: "6.0"
      - uses: nanasess/setup-chromedriver@v2
      - name: "Selenium Unit Tests"
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
        run: |
          echo $CHROMEWEBDRIVER
          echo "DRIVER_PATH=$CHROMEWEBDRIVER" >> "$GITHUB_ENV" 
          echo $DRIVER_PATH
          dotnet test Tests/Eyes.Selenium.UnitTests/Eyes.Selenium.UnitTests.csproj
#      - name: "Selenium E2E Tests"
